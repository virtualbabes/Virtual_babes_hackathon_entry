<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live 3D Spectate — Crypto-Seraph Dashboard</title>
<style>
  :root {
    --bg: #0a0e17;
    --card: #111827;
    --border: #1f2937;
    --accent: #6366f1;
    --green: #10b981;
    --red: #ef4444;
    --yellow: #f59e0b;
    --text: #e5e7eb;
    --muted: #9ca3af;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
  }
  #canvas-container {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
  }
  #hud {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 16px;
  }
  #hud-top { display: flex; justify-content: space-between; align-items: flex-start; }
  #hud-bottom { display: flex; justify-content: space-between; align-items: flex-end; }
  .hud-panel {
    background: rgba(17, 24, 39, 0.85);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    pointer-events: auto;
    backdrop-filter: blur(8px);
  }
  .hud-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .stat-bar {
    width: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    margin-top: 4px;
    overflow: hidden;
  }
  .stat-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.3s;
  }
  .stat-bar-fill.health { background: var(--green); }
  .stat-bar-fill.mana { background: var(--accent); }
  .stat-bar-fill.exp { background: var(--yellow); }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 6px;
    animation: pulse 2s infinite;
  }
  .status-dot.online { background: var(--green); }
  .status-dot.offline { background: var(--red); }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  #action-log {
    max-width: 300px;
    max-height: 150px;
    overflow-y: auto;
    font-family: 'Consolas', monospace;
    font-size: 11px;
  }
  .log-entry {
    padding: 2px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .log-time { color: var(--muted); margin-right: 8px; }
  .log-msg { color: var(--text); }
  .log-msg.ok { color: var(--green); }
  .log-msg.action { color: var(--accent); }
  .log-msg.system { color: var(--yellow); }
  .ctrl-btn {
    padding: 8px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
    display: inline-block;
  }
  .ctrl-btn:hover { border-color: var(--accent); }
  .ctrl-btn.active { background: var(--accent); border-color: var(--accent); }
  #controls { display: flex; gap: 8px; pointer-events: auto; }
  #minimap {
    width: 150px; height: 150px;
    background: rgba(17, 24, 39, 0.9);
    border: 1px solid var(--border);
    border-radius: 8px;
    position: relative;
    overflow: hidden;
  }
  #minimap-canvas { width: 100%; height: 100%; }
  .player-info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    font-size: 11px;
  }
  .player-info-grid .label { color: var(--muted); }
  .player-info-grid .value { color: var(--text); font-weight: 600; }
  #error-feed {
    position: absolute;
    bottom: 80px;
    left: 16px;
    max-width: 400px;
    max-height: 200px;
    overflow-y: auto;
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    border-radius: 8px;
    padding: 8px 12px;
    z-index: 200;
    font-family: 'Consolas', monospace;
    font-size: 11px;
    display: none;
  }
  #error-feed.visible { display: block; }
  #error-feed .err-title {
    color: #ef4444;
    font-weight: 700;
    margin-bottom: 4px;
    font-size: 12px;
  }
  #error-feed .err-msg {
    color: #fca5a5;
    margin-bottom: 2px;
    word-break: break-all;
  }
  #error-feed .err-stack {
    color: #9ca3af;
    font-size: 10px;
    white-space: pre-wrap;
    word-break: break-all;
  }
  #error-toggle {
    position: absolute;
    bottom: 16px;
    left: 16px;
    z-index: 200;
    padding: 6px 12px;
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.3);
    border-radius: 6px;
    color: #ef4444;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }
  #error-toggle:hover { background: rgba(239, 68, 68, 0.25); }
  #error-toggle.has-errors { animation: pulse-error 2s infinite; }
  @keyframes pulse-error {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .menu-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10, 14, 23, 0.98);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 1;
    transition: opacity 0.3s;
  }
  .menu-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .menu-panel {
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 16px;
    padding: 32px;
    width: 90%;
    max-width: 800px;
    min-height: 500px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.7);
    display: flex;
    flex-direction: column;
  }
  .menu-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid #1f2937;
  }
  .menu-header h2 {
    font-size: 24px;
    font-weight: 700;
    color: #e5e7eb;
    margin: 0;
  }
  .menu-close {
    background: none;
    border: none;
    color: #9ca3af;
    font-size: 24px;
    cursor: pointer;
    padding: 8px;
  }
  .menu-close:hover { color: #e5e7eb; }
  .menu-body {
    flex: 1;
    overflow-y: auto;
  }
  .menu-items {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .menu-item {
    padding: 20px;
    background: rgba(99, 102, 241, 0.1);
    border: 1px solid rgba(99, 102, 241, 0.2);
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    color: #e5e7eb;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .menu-item:hover {
    background: rgba(99, 102, 241, 0.2);
    border-color: #6366f1;
    transform: translateY(-2px);
  }
  .menu-item .icon {
    font-size: 28px;
    display: block;
    margin-bottom: 8px;
  }
  .menu-subpanel {
    width: 100%;
    max-width: 600px;
    background: rgba(99, 102, 241, 0.05);
    border: 1px solid rgba(99, 102, 241, 0.2);
    border-radius: 12px;
    padding: 20px;
  }
  .menu-subpanel.hidden { display: none; }
  .menu-subpanel-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid #1f2937;
  }
  .menu-back {
    padding: 6px 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .menu-back:hover { border-color: var(--accent); }
  .menu-subactions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }
  .menu-sub-actions .ctrl-btn {
    padding: 8px 14px;
    font-size: 12px;
  }
  .menu-subtitle {
    font-size: 18px;
    font-weight: 700;
    color: #e5e7eb;
    margin: 0;
  }
  .menu-subcontent {
    max-height: 400px;
    overflow-y: auto;
    font-size: 13px;
    color: #e5e7eb;
  }
  .menu-footer {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid #1f2937;
    font-size: 12px;
    color: #9ca3af;
    text-align: center;
  }
  .leaderboard-section {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid #1f2937;
  }
  .leaderboard-title {
    font-size: 16px;
    font-weight: 700;
    color: #6366f1;
    margin-bottom: 12px;
  }
  .leaderboard-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .leaderboard-entry {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: rgba(99, 102, 241, 0.05);
    border: 1px solid rgba(99, 102, 241, 0.1);
    border-radius: 8px;
  }
  .leaderboard-rank {
    font-size: 14px;
    font-weight: 700;
    color: #6366f1;
    width: 30px;
  }
  .leaderboard-name {
    flex: 1;
    font-size: 13px;
    color: #e5e7eb;
  }
  .leaderboard-score {
    font-size: 13px;
    font-weight: 600;
    color: #10b981;
  }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div id="hud">
  <div id="hud-top">
    <div class="hud-panel" id="player-info">
      <div class="hud-title">Player</div>
      <div style="font-size: 16px; font-weight: 700;" id="player-name">—</div>
      <div style="font-size: 11px; color: var(--muted); margin-top: 4px;" id="player-details">Connecting...</div>
      <div class="player-info-grid" style="margin-top: 8px;">
        <div><span class="label">Faction:</span> <span class="value" id="player-faction">—</span></div>
        <div><span class="label">Tier:</span> <span class="value" id="player-tier">—</span></div>
        <div><span class="label">Faith:</span> <span class="value" id="player-faith">—</span></div>
        <div><span class="label">Club:</span> <span class="value" id="player-club">—</span></div>
      </div>
    </div>
    <div class="hud-panel">
      <div class="hud-title">Connection</div>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;">
        <span class="status-dot offline" id="status-dot"></span>
        <span id="status-text" style="color: var(--muted);">Offline</span>
      </div>
      <div style="display: flex; gap: 16px; margin-top: 8px; font-size: 12px;">
        <div style="color: var(--muted);">Frame: <span id="frame-id" style="color: var(--text); font-weight: 600;">0</span></div>
        <div style="color: var(--muted);">FPS: <span id="fps" style="color: var(--text); font-weight: 600;">0</span></div>
      </div>
    </div>
    <div class="hud-panel" id="stats-panel">
      <div class="hud-title">Stats</div>
      <div style="font-size: 11px; color: var(--muted);">Health</div>
      <div class="stat-bar"><div class="stat-bar-fill health" id="health-bar" style="width: 100%;"></div></div>
      <div style="font-size: 11px; color: var(--muted); margin-top: 6px;">Mana</div>
      <div class="stat-bar"><div class="stat-bar-fill mana" id="mana-bar" style="width: 100%;"></div></div>
      <div style="font-size: 11px; color: var(--muted); margin-top: 6px;">Experience</div>
      <div class="stat-bar"><div class="stat-bar-fill exp" id="exp-bar" style="width: 0%;"></div></div>
      <div style="display: flex; gap: 16px; margin-top: 8px; font-size: 12px;">
        <div style="color: var(--muted);">Score: <span id="score" style="color: var(--text); font-weight: 600;">0</span></div>
        <div style="color: var(--muted);">Level: <span id="level" style="color: var(--text); font-weight: 600;">1</span></div>
      </div>
    </div>
  </div>
  <div id="hud-bottom">
    <div class="hud-panel" id="action-log-panel">
      <div class="hud-title">Action Log</div>
      <div id="action-log"></div>
    </div>
    <div class="hud-panel">
      <div class="hud-title">Minimap</div>
      <canvas id="minimap-canvas" width="150" height="150"></canvas>
    </div>
    <div id="controls">
      <button class="ctrl-btn active" id="btn-follow" onclick="toggleFollow()">👁 Follow</button>
      <button class="ctrl-btn" id="btn-rotate" onclick="toggleAutoRotate()">🔄 Rotate</button>
      <button class="ctrl-btn" onclick="resetView()">⌖ Reset</button>
      <button class="ctrl-btn" onclick="refreshReplay()">⟳ Refresh</button>
    </div>
  </div>
</div>

<!-- Error Feed -->
<button id="error-toggle" onclick="toggleErrorFeed()">⚠ Errors (0)</button>
<div id="error-feed">
  <div class="err-title">⚠ Error Feed</div>
  <div id="error-list"></div>
</div>

<!-- Menu Overlay -->
<div id="menu-overlay" class="menu-overlay hidden">
  <div class="menu-panel">
    <div class="menu-header">
      <h2 id="menu-title">☰ Menu</h2>
      <button class="menu-close" onclick="document.getElementById('menu-overlay').classList.add('hidden')">✕</button>
    </div>
    <div class="menu-body">
      <div id="menu-items" class="menu-items"></div>
      <div id="menu-subpanel" class="menu-subpanel hidden">
        <div class="menu-subpanel-head">
          <button class="menu-back" onclick="showMainMenu()">← Back</button>
          <h3 id="menu-subtitle">Sub Panel</h3>
        </div>
        <div id="menu-subcontent" class="menu-subcontent"></div>
      </div>
      <div class="leaderboard-section">
        <div class="leaderboard-title">🏆 Leaderboard</div>
        <div id="leaderboard-list" class="leaderboard-list">
          <div class="leaderboard-entry">
            <span class="leaderboard-rank">1</span>
            <span class="leaderboard-name">Loading...</span>
            <span class="leaderboard-score">—</span>
          </div>
        </div>
      </div>
    </div>
    <div class="menu-footer">
      <p>Navigate with arrow keys or click an option</p>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "/vendor/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

const API_BASE = 'http://127.0.0.1:8090';

// ── Three.js Scene ──────────────────────────────────────────────────────────
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e17);
scene.fog = new THREE.Fog(0x0a0e17, 50, 200);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 15, 30);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 1);
dirLight.position.set(10, 20, 10);
dirLight.castShadow = true;
scene.add(dirLight);

// Ground
const groundGeo = new THREE.PlaneGeometry(200, 200, 50, 50);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.8, metalness: 0.2 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Grid
const gridHelper = new THREE.GridHelper(200, 40, 0x1f2937, 0x1f2937);
scene.add(gridHelper);

// ── Player Character ────────────────────────────────────────────────────────
const playerGroup = new THREE.Group();
scene.add(playerGroup);

const bodyGeo = new THREE.CapsuleGeometry(0.5, 1.5, 8, 16);
const bodyMat = new THREE.MeshStandardMaterial({
  color: 0x6366f1, roughness: 0.3, metalness: 0.7, emissive: 0x6366f1, emissiveIntensity: 0.2
});
const body = new THREE.Mesh(bodyGeo, bodyMat);
body.position.y = 1.25;
body.castShadow = true;
playerGroup.add(body);

const headGeo = new THREE.SphereGeometry(0.35, 16, 16);
const headMat = new THREE.MeshStandardMaterial({
  color: 0xa855f7, roughness: 0.3, metalness: 0.7, emissive: 0xa855f7, emissiveIntensity: 0.2
});
const head = new THREE.Mesh(headGeo, headMat);
head.position.y = 2.35;
head.castShadow = true;
playerGroup.add(head);

const eyeGeo = new THREE.SphereGeometry(0.08, 8, 8);
const eyeMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
leftEye.position.set(-0.12, 2.4, 0.28);
playerGroup.add(leftEye);
const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
rightEye.position.set(0.12, 2.4, 0.28);
playerGroup.add(rightEye);

// Name label
const labelCanvas = document.createElement('canvas');
labelCanvas.width = 256; labelCanvas.height = 64;
const labelCtx = labelCanvas.getContext('2d');
labelCtx.fillStyle = 'rgba(17, 24, 39, 0.8)';
labelCtx.fillRect(0, 0, 256, 64);
labelCtx.fillStyle = '#e5e7eb';
labelCtx.font = 'bold 24px sans-serif';
labelCtx.textAlign = 'center';
labelCtx.fillText('Crypto-Seraph', 128, 40);
const labelTexture = new THREE.CanvasTexture(labelCanvas);
const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: labelTexture }));
label.position.y = 3.2;
label.scale.set(2, 0.5, 1);
playerGroup.add(label);

// ── Territory Markers ───────────────────────────────────────────────────────
const territories = [
  { name: 'Base', x: 0, z: 0, color: 0x6366f1 },
  { name: 'North', x: 0, z: -30, color: 0x10b981 },
  { name: 'East', x: 30, z: 0, color: 0xf59e0b },
  { name: 'South', x: 0, z: 30, color: 0xef4444 },
  { name: 'West', x: -30, z: 0, color: 0xa855f7 },
];
territories.forEach(t => {
  const geo = new THREE.CylinderGeometry(3, 3, 0.2, 32);
  const mat = new THREE.MeshStandardMaterial({
    color: t.color, roughness: 0.5, metalness: 0.5, emissive: t.color, emissiveIntensity: 0.3, transparent: true, opacity: 0.7
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(t.x, 0.1, t.z);
  scene.add(mesh);

  const tCanvas = document.createElement('canvas');
  tCanvas.width = 128; tCanvas.height = 32;
  const tCtx = tCanvas.getContext('2d');
  tCtx.fillStyle = 'rgba(17, 24, 39, 0.8)';
  tCtx.fillRect(0, 0, 128, 32);
  tCtx.fillStyle = '#e5e7eb';
  tCtx.font = 'bold 16px sans-serif';
  tCtx.textAlign = 'center';
  tCtx.fillText(t.name, 64, 22);
  const tTexture = new THREE.CanvasTexture(tCanvas);
  const tLabel = new THREE.Sprite(new THREE.SpriteMaterial({ map: tTexture }));
  tLabel.position.set(t.x, 3, t.z);
  tLabel.scale.set(2, 0.5, 1);
  scene.add(tLabel);
});

// ── Replay State ────────────────────────────────────────────────────────────
let replayFrames = [];
let currentFrameIndex = 0;
let isPlaying = true;
let isFollowing = true;
let autoRotate = false;
let frameCount = 0;
let lastFpsTime = Date.now();
let logs = [];
let lastAction = '';
let lastFrameId = 0;
let isFetching = false;

// ── Animation Loop ──────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);

  if (isPlaying && replayFrames.length > 0) {
    currentFrameIndex = (currentFrameIndex + 1) % replayFrames.length;
    const frame = replayFrames[currentFrameIndex];
    updateScene(frame);
  }

  const time = Date.now() * 0.003;
  body.position.y = 1.25 + Math.sin(time) * 0.05;
  head.position.y = 2.35 + Math.sin(time + 0.5) * 0.03;

  if (autoRotate) {
    const t = Date.now() * 0.0005;
    camera.position.x = Math.sin(t) * 30;
    camera.position.z = Math.cos(t) * 30;
    camera.lookAt(0, 0, 0);
  } else if (isFollowing && replayFrames.length > 0) {
    const pos = replayFrames[currentFrameIndex].position;
    camera.position.x = pos.x;
    camera.position.z = pos.z + 20;
    camera.position.y = 15;
    camera.lookAt(pos.x, 0, pos.z);
  }

  renderer.render(scene, camera);

  frameCount++;
  const now = Date.now();
  if (now - lastFpsTime >= 1000) {
    document.getElementById('fps').textContent = frameCount;
    frameCount = 0;
    lastFpsTime = now;
  }
}

animate();

// ── Update Scene ────────────────────────────────────────────────────────────
function updateScene(frame) {
  const isMenu = frame.action && (frame.action.includes('menu') || frame.action === 'open_menu' || frame.action === 'close_menu');
  const menuOverlay = document.getElementById('menu-overlay');
  const menuTitle = document.getElementById('menu-title');
  const menuItems = document.getElementById('menu-items');
  
  if (isMenu && menuOverlay) {
    menuOverlay.classList.remove('hidden');
    const menuMap = {
      'open_menu': '☰ Main Menu',
      'menu_territories': '🗺️ Territories',
      'menu_faith': '⛪ Faith',
      'menu_rivalry': '⚔️ Rivalries',
      'menu_events': '🎪 Events',
      'menu_ai_citizens': '🤖 AI Citizens',
      'menu_creator_store': '🎨 Creator Store',
      'menu_launchpad': '🚀 Launchpad',
      'close_menu': '☰ Main Menu'
    };
    menuTitle.textContent = menuMap[frame.action] || '☰ Menu';
    const items = [
      { icon: '👤', label: 'Profile', action: 'profile' },

      { icon: '⛪', label: 'Faith', action: 'faith' },
      { icon: '⚔️', label: 'Rivalries', action: 'rivalry' },
      { icon: '🎪', label: 'Events', action: 'events' },
      { icon: '🤖', label: 'AI Citizens', action: 'ai_citizens' },
      { icon: '🎨', label: 'Creator Store', action: 'creator_store' },
      { icon: '🚀', label: 'Launchpad', action: 'launchpad' }
    ];

    fetchLeaderboard();
    body.position.y = 1.25;
    head.position.y = 2.35;
  } else if (menuOverlay) {
    menuOverlay.classList.add('hidden');
  }

  playerGroup.position.x += (frame.position.x - playerGroup.position.x) * 0.1;
  playerGroup.position.z += (frame.position.z - playerGroup.position.z) * 0.1;
  playerGroup.rotation.y += (frame.rotation - playerGroup.rotation.y) * 0.1;

  document.getElementById('frame-id').textContent = frame.frame_id;
  document.getElementById('player-name').textContent = frame.player.name || 'Crypto-Seraph';
  document.getElementById('player-details').textContent = frame.territory + ' • ' + frame.region;
  document.getElementById('player-faction').textContent = frame.player.faction || '—';
  document.getElementById('player-tier').textContent = frame.player.career_tier || '—';
  document.getElementById('player-faith').textContent = frame.player.faith || '—';
  document.getElementById('player-club').textContent = frame.player.club || '—';
  document.getElementById('score').textContent = frame.score;
  document.getElementById('level').textContent = frame.level;
  document.getElementById('health-bar').style.width = Math.min(100, frame.health) + '%';
  document.getElementById('mana-bar').style.width = Math.min(100, frame.mana) + '%';
  document.getElementById('exp-bar').style.width = Math.min(100, frame.experience / 100) + '%';

  updateMinimap(frame);

  if (frame.action && frame.action !== lastAction) {
    lastAction = frame.action;
    addLog(frame.action, 'action');
  }
}

function updateMinimap(frame) {
  const canvas = document.getElementById('minimap-canvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, 150, 150);

  territories.forEach(t => {
    const x = 75 + (t.x / 50) * 70;
    const y = 75 + (t.z / 50) * 70;
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.strokeRect(x - 10, y - 10, 20, 20);
    ctx.fillStyle = '#9ca3af';
    ctx.font = '8px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(t.name, x, y + 14);
  });

  const px = 75 + (frame.position.x / 50) * 70;
  const py = 75 + (frame.position.z / 50) * 70;
  ctx.fillStyle = '#6366f1';
  ctx.beginPath();
  ctx.arc(px, py, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowColor = '#6366f1';
  ctx.shadowBlur = 8;
  ctx.fill();
  ctx.shadowBlur = 0;
}

function addLog(msg, type) {
  const now = new Date();
  const time = now.toTimeString().split(' ')[0];
  logs.push({ time, msg, type });
  if (logs.length > 50) logs.shift();
  const container = document.getElementById('action-log');
  container.innerHTML = logs.map(l => '<div class="log-entry"><span class="log-time">' + l.time + '</span><span class="log-msg ' + l.type + '">' + l.msg + '</span></div>').join('');
  container.scrollTop = container.scrollHeight;
}

// ── Error Capture ───────────────────────────────────────────────────────────
var errorCount = 0;
var errorList = [];

window.captureError = function(msg, stack) {
  errorCount++;
  errorList.push({ msg: msg, stack: stack, time: Date.now() });
  var toggle = document.getElementById('error-toggle');
  toggle.textContent = '⚠ Errors (' + errorCount + ')';
  toggle.classList.add('has-errors');
  var list = document.getElementById('error-list');
  list.innerHTML = errorList.slice(-10).map(function(e) {
    return '<div class="err-msg">' + e.msg + '</div>' + (e.stack ? '<div class="err-stack">' + e.stack + '</div>' : '');
  }).join('');
  fetch('/api/client-error', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ msg: msg, stack: stack, url: window.location.href, timestamp: Date.now() })
  }).catch(function() {});
};

window.onerror = function(msg, url, line, col, error) {
  window.captureError(msg + ' (line ' + line + ')', error && error.stack);
  return false;
};

window.addEventListener('unhandledrejection', function(event) {
  window.captureError('Promise: ' + event.reason, event.reason && event.reason.stack);
});

window.toggleErrorFeed = function() {
  document.getElementById('error-feed').classList.toggle('visible');
};

// ── Fetch Frames ────────────────────────────────────────────────────────────
async function fetchNewFrames() {
  if (isFetching) return;
  isFetching = true;
  try {
    var url = API_BASE + '/api/replay/frames?since=' + lastFrameId;
    var res = await fetch(url);
    if (!res.ok) return;
    var data = await res.json();
    if (data.success && data.frames.length > 0) {
      replayFrames = replayFrames.concat(data.frames);
      lastFrameId = data.frames[data.frames.length - 1].frame_id;
      if (replayFrames.length > 100) {
        replayFrames = replayFrames.slice(replayFrames.length - 100);
        currentFrameIndex = Math.min(currentFrameIndex, replayFrames.length - 1);
      }
      setConnection(true);
    }
  } catch (e) {
    setConnection(false);
  } finally {
    isFetching = false;
  }
}

function setConnection(online) {
  var dot = document.getElementById('status-dot');
  var text = document.getElementById('status-text');
  if (online) {
    dot.className = 'status-dot online';
    text.textContent = 'Connected';
    text.style.color = 'var(--green)';
  } else {
    dot.className = 'status-dot offline';
    text.textContent = 'Offline';
    text.style.color = 'var(--red)';
  }
}

window.addEventListener('resize', function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ── Initial Load with Retry ─────────────────────────────────────────────────
async function initWithRetry(maxRetries, delay) {
  maxRetries = maxRetries || 10;
  delay = delay || 1000;
  for (var i = 0; i < maxRetries; i++) {
    try {
      var res = await fetch(API_BASE + '/api/replay/frames?since=0&limit=160');
      if (res.ok) {
        var data = await res.json();
        if (data.success && data.frames.length > 0) {
          replayFrames = data.frames;
          lastFrameId = replayFrames[replayFrames.length - 1].frame_id;
          setConnection(true);
          addLog('Loaded ' + replayFrames.length + ' frames', 'ok');
          return;
        }
      }
    } catch (e) {}
    if (i < maxRetries - 1) {
      addLog('Retry ' + (i + 1) + '/' + maxRetries + '...', 'warn');
      await new Promise(function(r) { setTimeout(r, delay); });
    }
  }
  setConnection(false);
  addLog('Failed to load frames after retries', 'err');
}

initWithRetry();
setInterval(fetchNewFrames, 2000);
addLog('Replay player initialized', 'system');
