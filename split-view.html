<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split View — NFT-Seduction</title>
<style>
  :root {
    --bg: #0a0e17;
    --card: #111827;
    --border: #1f2937;
    --accent: #6366f1;
    --green: #10b981;
    --red: #ef4444;
    --yellow: #f59e0b;
    --text: #e5e7eb;
    --muted: #9ca3af;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .top-bar h1 {
    font-size: 14px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .top-bar .status {
    font-size: 11px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    animation: pulse 2s infinite;
  }
  .dot.online { background: var(--green); }
  .dot.offline { background: var(--red); }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .split-container {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  .pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    overflow: hidden;
    position: relative;
  }
  .pane:last-child { border-right: none; }
  .pane-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 12px;
    background: rgba(99, 102, 241, 0.05);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .pane-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .pane-body {
    flex: 1;
    overflow: hidden;
    position: relative;
  }
  .pane-body iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
  .pane-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10, 14, 23, 0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    z-index: 10;
    transition: opacity 0.3s;
  }
  .pane-overlay.hidden { opacity: 0; pointer-events: none; }
  .pane-overlay .icon { font-size: 32px; }
  .pane-overlay .msg { font-size: 12px; color: var(--muted); }
  .pane-overlay .retry-btn {
    padding: 6px 14px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }
  .controls { display: flex; gap: 6px; align-items: center; }
  .ctrl-btn {
    padding: 4px 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 10px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
    display: inline-block;
  }
  .ctrl-btn:hover { border-color: var(--accent); }
  .ctrl-btn.active { background: var(--accent); border-color: var(--accent); }
  .divider {
    width: 4px;
    background: var(--border);
    cursor: col-resize;
    flex-shrink: 0;
    transition: background 0.2s;
  }
  .divider:hover { background: var(--accent); }
  .layout-btns { display: flex; gap: 4px; }
</style>
</head>
<body>

<div class="top-bar">
  <h1>⚡ Split View — Crypto-Seraph Dashboard</h1>
  <div class="status">
    <span class="dot offline" id="statusDot"></span>
    <span id="statusText" style="color:var(--muted);">Checking...</span>
  </div>
  <div class="layout-btns">
    <button class="ctrl-btn active" onclick="setLayout('5050')">50/50</button>
    <button class="ctrl-btn" onclick="setLayout('7030')">70/30</button>
    <button class="ctrl-btn" onclick="setLayout('3070')">30/70</button>
    <button class="ctrl-btn" onclick="swapPanes()">⇄ Swap</button>
  </div>
</div>

<div class="split-container" id="splitContainer">
  <div class="pane" id="paneLeft" style="flex:1;">
    <div class="pane-header">
      <span class="pane-title">📊 Dashboard</span>
      <div class="controls">
        <button class="ctrl-btn" onclick="refreshLeft()">⟳</button>
        <a href="http://127.0.0.1:8090/dashboard" target="_blank" class="ctrl-btn">⤢</a>
      </div>
    </div>
    <div class="pane-body">
      <iframe src="http://127.0.0.1:8090/dashboard" id="frameLeft"></iframe>
      <div class="pane-overlay hidden" id="overlayLeft">
        <div class="icon">🔌</div>
        <div class="msg">Server offline</div>
        <button class="retry-btn" onclick="refreshLeft()">Retry</button>
      </div>
    </div>
  </div>
  <div class="divider" id="divider"></div>
  <div class="pane" id="paneRight" style="flex:1;">
    <div class="pane-header">
      <span class="pane-title">🎮 3D Spectate</span>
      <div class="controls">
        <button class="ctrl-btn" onclick="refreshRight()">⟳</button>
        <a href="http://127.0.0.1:8090/spectate" target="_blank" class="ctrl-btn">⤢</a>
      </div>
    </div>
    <div class="pane-body">
      <iframe src="http://127.0.0.1:8090/spectate" id="frameRight"></iframe>
      <div class="pane-overlay hidden" id="overlayRight">
        <div class="icon">🔌</div>
        <div class="msg">Server offline</div>
        <button class="retry-btn" onclick="refreshRight()">Retry</button>
      </div>
    </div>
  </div>
</div>

<script>
const API_BASE = 'http://127.0.0.1:8090';
let wasOnline = null;
let checkInterval;

async function checkConnection() {
  try {
    const res = await fetch(API_BASE + '/api/replay/state', { 
      method: 'GET',
      cache: 'no-store'
    });
    if (res.ok) {
      setOnline(true);
      return true;
    }
    setOnline(false);
    return false;
  } catch (e) {
    setOnline(false);
    return false;
  }
}

function setOnline(online) {
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  const overlayLeft = document.getElementById('overlayLeft');
  const overlayRight = document.getElementById('overlayRight');

  if (online) {
    dot.className = 'dot online';
    text.textContent = 'Connected';
    text.style.color = 'var(--green)';
    overlayLeft.classList.add('hidden');
    overlayRight.classList.add('hidden');
    
    // If we were previously offline, auto-refresh the iframes
    if (wasOnline === false) {
      refreshLeft();
      refreshRight();
    }
    wasOnline = true;
  } else {
    dot.className = 'dot offline';
    text.textContent = 'Offline';
    text.style.color = 'var(--red)';
    overlayLeft.classList.remove('hidden');
    overlayRight.classList.remove('hidden');
    wasOnline = false;
  }
}

function refreshLeft() {
  const frame = document.getElementById('frameLeft');
  frame.src = 'http://127.0.0.1:8090/dashboard';
}

function refreshRight() {
  const frame = document.getElementById('frameRight');
  frame.src = 'http://127.0.0.1:8090/spectate';
}

function setLayout(ratio) {
  const left = document.getElementById('paneLeft');
  const right = document.getElementById('paneRight');
  if (ratio === '5050') {
    left.style.flex = '1';
    right.style.flex = '1';
  } else if (ratio === '7030') {
    left.style.flex = '7';
    right.style.flex = '3';
  } else if (ratio === '3070') {
    left.style.flex = '3';
    right.style.flex = '7';
  }
  document.querySelectorAll('.layout-btns .ctrl-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
}

function swapPanes() {
  const left = document.getElementById('paneLeft');
  const right = document.getElementById('paneRight');
  
  const tempTitle = left.querySelector('.pane-title').textContent;
  const tempSrc = left.querySelector('iframe').src;
  
  left.querySelector('.pane-title').textContent = right.querySelector('.pane-title').textContent;
  left.querySelector('iframe').src = right.querySelector('iframe').src;
  
  right.querySelector('.pane-title').textContent = tempTitle;
  right.querySelector('iframe').src = tempSrc;
}

// Draggable divider
const divider = document.getElementById('divider');
let isDragging = false;

divider.addEventListener('mousedown', () => {
  isDragging = true;
  document.body.style.cursor = 'col-resize';
});

document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const container = document.getElementById('splitContainer');
  const rect = container.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const percent = (x / rect.width) * 100;
  if (percent > 20 && percent < 80) {
    document.getElementById('paneLeft').style.flex = percent;
    document.getElementById('paneRight').style.flex = 100 - percent;
  }
});

document.addEventListener('mouseup', () => {
  isDragging = false;
  document.body.style.cursor = '';
});

// Initial check + auto-sync every 3 seconds
checkConnection();
checkInterval = setInterval(checkConnection, 3000);

// Also check when window regains focus
window.addEventListener('focus', () => {
  checkConnection();
});

// Cleanup on unload
window.addEventListener('beforeunload', () => {
  clearInterval(checkInterval);
});
</script>
</body>
</html>
