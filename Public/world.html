<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT-Seduction — 3D World</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0e17; overflow: hidden; font-family: 'Inter', sans-serif; }
        #world-canvas { width: 100vw; height: 100vh; display: block; }

        /* HUD Overlay */
        .world-hud {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none; z-index: 10;
        }
        .world-hud > * { pointer-events: auto; }

        /* Top Bar */
        .world-topbar {
            position: absolute; top: 0; left: 0; right: 0;
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 24px;
            background: linear-gradient(180deg, rgba(10,14,23,0.9) 0%, transparent 100%);
        }
        .world-topbar-left { display: flex; align-items: center; gap: 16px; }
        .world-topbar-right { display: flex; align-items: center; gap: 12px; }
        .world-title { font-family: 'Orbitron', sans-serif; font-size: 14px; letter-spacing: 2px; color: #e5e7eb; }
        .world-wallet { font-size: 12px; color: #90a4ae; background: rgba(99,102,241,0.1); padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(99,102,241,0.2); }
        .world-vbv { font-size: 12px; color: #ffd700; background: rgba(255,215,0,0.1); padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(255,215,0,0.2); }

        /* Region Indicator */
        .world-region {
            position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
            background: rgba(10,14,23,0.85); border: 1px solid rgba(99,102,241,0.3);
            padding: 8px 20px; border-radius: 20px;
            font-family: 'Orbitron', sans-serif; font-size: 12px; letter-spacing: 1px;
            color: #e5e7eb; backdrop-filter: blur(10px);
        }

        /* Controls Help */
        .world-controls {
            position: absolute; bottom: 100px; left: 24px;
            background: rgba(10,14,23,0.85); border: 1px solid rgba(99,102,241,0.2);
            padding: 16px; border-radius: 12px; backdrop-filter: blur(10px);
            font-size: 11px; color: #90a4ae; line-height: 1.8;
        }
        .world-controls h4 { font-family: 'Orbitron', sans-serif; font-size: 11px; color: #e5e7eb; margin-bottom: 8px; letter-spacing: 1px; }
        .world-controls kbd { background: rgba(99,102,241,0.2); padding: 2px 6px; border-radius: 3px; color: #e5e7eb; font-size: 10px; }

        /* Bottom Bar */
        .world-bottombar {
            position: absolute; bottom: 0; left: 0; right: 0;
            display: flex; justify-content: center; align-items: center; gap: 16px;
            padding: 16px 24px;
            background: linear-gradient(0deg, rgba(10,14,23,0.9) 0%, transparent 100%);
        }
        .world-btn {
            padding: 10px 20px; font-size: 12px; font-weight: 600;
            background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.3);
            border-radius: 8px; color: #e5e7eb; cursor: pointer;
            transition: all 0.2s ease; font-family: 'Inter', sans-serif;
        }
        .world-btn:hover { background: rgba(99,102,241,0.2); border-color: rgba(99,102,241,0.5); transform: translateY(-2px); }
        .world-btn.primary { background: rgba(99,102,241,0.3); border-color: rgba(99,102,241,0.5); }

        /* Minimap */
        .world-minimap {
            position: absolute; bottom: 80px; right: 24px;
            width: 160px; height: 160px;
            background: rgba(10,14,23,0.85); border: 1px solid rgba(99,102,241,0.3);
            border-radius: 12px; overflow: hidden; backdrop-filter: blur(10px);
        }
        .world-minimap canvas { width: 100%; height: 100%; }

        /* Entity List */
        .world-entities {
            position: absolute; top: 80px; right: 24px;
            width: 200px; max-height: 300px; overflow-y: auto;
            background: rgba(10,14,23,0.85); border: 1px solid rgba(99,102,241,0.2);
            border-radius: 12px; backdrop-filter: blur(10px);
            padding: 12px;
        }
        .world-entities h4 { font-family: 'Orbitron', sans-serif; font-size: 10px; color: #e5e7eb; letter-spacing: 1px; margin-bottom: 8px; }
        .entity-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid rgba(99,102,241,0.1); font-size: 11px; color: #90a4ae; }
        .entity-item:last-child { border-bottom: none; }
        .entity-item .entity-icon { font-size: 14px; }

        /* Travel Menu */
        .travel-menu {
            position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%);
            display: none; gap: 8px; background: rgba(10,14,23,0.95);
            border: 1px solid rgba(99,102,241,0.3); border-radius: 12px;
            padding: 12px; backdrop-filter: blur(10px);
        }
        .travel-menu.visible { display: flex; }
        .travel-option {
            padding: 8px 16px; font-size: 11px;
            background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.2);
            border-radius: 6px; color: #e5e7eb; cursor: pointer; text-align: center;
            transition: all 0.2s ease;
        }
        .travel-option:hover { background: rgba(99,102,241,0.25); }

        /* Loading */
        .world-loading {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #0a0e17; display: flex; align-items: center; justify-content: center;
            z-index: 100; transition: opacity 0.5s ease;
        }
        .world-loading.hidden { opacity: 0; pointer-events: none; }
        .loading-spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(99,102,241,0.2); border-top-color: #6366f1;
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <canvas id="world-canvas"></canvas>

    <!-- Loading -->
    <div class="world-loading" id="world-loading">
        <div class="loading-spinner"></div>
    </div>

    <!-- HUD -->
    <div class="world-hud">
        <!-- Top Bar -->
        <div class="world-topbar">
            <div class="world-topbar-left">
                <span class="world-title">🌍 3D WORLD</span>
                <span class="world-wallet" id="world-wallet">0x----...----</span>
                <span class="world-vbv" id="world-vbv">0 $VBV</span>
            </div>
            <div class="world-topbar-right">
                <button class="world-btn" onclick="window.close()">✕ Close</button>
            </div>
        </div>

        <!-- Region Indicator -->
        <div class="world-region" id="world-region">📍 Base</div>

        <!-- Controls Help -->
        <div class="world-controls">
            <h4>CONTROLS</h4>
            <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move</div>
            <div><kbd>Mouse</kbd> Look around</div>
            <div><kbd>Space</kbd> Jump</div>
            <div><kbd>Shift</kbd> Sprint</div>
            <div><kbd>E</kbd> Interact</div>
        </div>

        <!-- Entity List -->
        <div class="world-entities" id="world-entities">
            <h4>NEARBY ENTITIES</h4>
            <div id="entity-list"></div>
        </div>

        <!-- Minimap -->
        <div class="world-minimap">
            <canvas id="minimap-canvas"></canvas>
        </div>

        <!-- Travel Menu -->
        <div class="travel-menu" id="travel-menu">
            <div class="travel-option" onclick="travelTo('base')">📍 Base</div>
            <div class="travel-option" onclick="travelTo('north')">❄️ North</div>
            <div class="travel-option" onclick="travelTo('east')">🌅 East</div>
            <div class="travel-option" onclick="travelTo('south')">🌴 South</div>
            <div class="travel-option" onclick="travelTo('west')">🌄 West</div>
            <div class="travel-option" onclick="travelTo('club')">🏛️ My Club</div>
        </div>

        <!-- Bottom Bar -->
        <div class="world-bottombar">
            <button class="world-btn" onclick="toggleTravel()">🧭 Travel</button>
            <button class="world-btn primary" onclick="interact()">⚡ Interact (E)</button>
            <button class="world-btn" onclick="openMenu()">☰ Menu</button>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "/vendor/three.module.js"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // ── State ─────────────────────────────────────────────────────────
        const state = {
            wallet: '',
            region: 'Base',
            moveSpeed: 8,
            sprintMultiplier: 2,
            isSprinting: false,
            isJumping: false,
            velocity: new THREE.Vector3(),
            keys: {},
            nearbyEntities: [],
        };

        // ── Three.js Setup ────────────────────────────────────────────────
        const canvas = document.getElementById('world-canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0e17);
        scene.fog = new THREE.Fog(0x0a0e17, 50, 200);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 30);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // Ground
        const groundGeo = new THREE.PlaneGeometry(200, 200, 50, 50);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.8, metalness: 0.2 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Grid
        const gridHelper = new THREE.GridHelper(200, 40, 0x1f2937, 0x1f2937);
        scene.add(gridHelper);

        // ── Player Avatar ─────────────────────────────────────────────────
        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        const bodyGeo = new THREE.CapsuleGeometry(0.5, 1.5, 8, 16);
        const bodyMat = new THREE.MeshStandardMaterial({
            color: 0x6366f1, roughness: 0.3, metalness: 0.7, emissive: 0x6366f1, emissiveIntensity: 0.2
        });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 1.25;
        body.castShadow = true;
        playerGroup.add(body);

        const headGeo = new THREE.SphereGeometry(0.35, 16, 16);
        const headMat = new THREE.MeshStandardMaterial({
            color: 0xa855f7, roughness: 0.3, metalness: 0.7, emissive: 0xa855f7, emissiveIntensity: 0.2
        });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 2.35;
        head.castShadow = true;
        playerGroup.add(head);

        const eyeGeo = new THREE.SphereGeometry(0.08, 8, 8);
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
        leftEye.position.set(-0.12, 2.4, 0.28);
        playerGroup.add(leftEye);
        const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
        rightEye.position.set(0.12, 2.4, 0.28);
        playerGroup.add(rightEye);

        // Name label
        const labelCanvas = document.createElement('canvas');
        labelCanvas.width = 256; labelCanvas.height = 64;
        const labelCtx = labelCanvas.getContext('2d');
        labelCtx.fillStyle = 'rgba(17, 24, 39, 0.8)';
        labelCtx.fillRect(0, 0, 256, 64);
        labelCtx.fillStyle = '#e5e7eb';
        labelCtx.font = 'bold 24px sans-serif';
        labelCtx.textAlign = 'center';
        labelCtx.fillText('You', 128, 40);
        const labelTexture = new THREE.CanvasTexture(labelCanvas);
        const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: labelTexture }));
        label.position.y = 3.2;
        label.scale.set(2, 0.5, 1);
        playerGroup.add(label);

        // ── Territory Markers ─────────────────────────────────────────────
        const territories = [
            { name: 'Base', x: 0, z: 0, color: 0x6366f1 },
            { name: 'North', x: 0, z: -30, color: 0x10b981 },
            { name: 'East', x: 30, z: 0, color: 0xf59e0b },
            { name: 'South', x: 0, z: 30, color: 0xef4444 },
            { name: 'West', x: -30, z: 0, color: 0xa855f7 },
        ];
        territories.forEach(t => {
            const geo = new THREE.CylinderGeometry(3, 3, 0.2, 32);
            const mat = new THREE.MeshStandardMaterial({
                color: t.color, roughness: 0.5, metalness: 0.5, emissive: t.color, emissiveIntensity: 0.3, transparent: true, opacity: 0.7
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(t.x, 0.1, t.z);
            scene.add(mesh);

            const tCanvas = document.createElement('canvas');
            tCanvas.width = 128; tCanvas.height = 32;
            const tCtx = tCanvas.getContext('2d');
            tCtx.fillStyle = 'rgba(17, 24, 39, 0.8)';
            tCtx.fillRect(0, 0, 128, 32);
            tCtx.fillStyle = '#e5e7eb';
            tCtx.font = 'bold 16px sans-serif';
            tCtx.textAlign = 'center';
            tCtx.fillText(t.name, 64, 22);
            const tTexture = new THREE.CanvasTexture(tCanvas);
            const tLabel = new THREE.Sprite(new THREE.SpriteMaterial({ map: tTexture }));
            tLabel.position.set(t.x, 5, t.z);
            tLabel.scale.set(4, 1, 1);
            scene.add(tLabel);
        });

        // ── Nearby Entities (NPCs, Pets, etc.) ────────────────────────────
        const entityTypes = [
            { icon: '🤖', name: 'AI Citizen', color: 0x00bcd4 },
            { icon: '🐾', name: 'Pet', color: 0xff6b35 },
            { icon: '🚗', name: 'Vehicle', color: 0x7cb342 },
            { icon: '👤', name: 'Player', color: 0x9c27b0 },
        ];

        for (let i = 0; i < 8; i++) {
            const type = entityTypes[Math.floor(Math.random() * entityTypes.length)];
            const angle = Math.random() * Math.PI * 2;
            const dist = 8 + Math.random() * 20;
            const x = Math.cos(angle) * dist;
            const z = Math.sin(angle) * dist;

            const eGeo = new THREE.CapsuleGeometry(0.3, 1, 4, 8);
            const eMat = new THREE.MeshStandardMaterial({
                color: type.color, roughness: 0.4, metalness: 0.6, emissive: type.color, emissiveIntensity: 0.15
            });
            const eMesh = new THREE.Mesh(eGeo, eMat);
            eMesh.position.set(x, 0.8, z);
            eMesh.castShadow = true;
            scene.add(eMesh);

            state.nearbyEntities.push({ ...type, x, z, mesh: eMesh });
        }

        // ── Input Handling ────────────────────────────────────────────────
        document.addEventListener('keydown', (e) => {
            state.keys[e.key.toLowerCase()] = true;
            if (e.key === 'Shift') state.isSprinting = true;
            if (e.key === ' ' && !state.isJumping) {
                state.isJumping = true;
                state.velocity.y = 8;
            }
            if (e.key.toLowerCase() === 'e') interact();
        });
        document.addEventListener('keyup', (e) => {
            state.keys[e.key.toLowerCase()] = false;
            if (e.key === 'Shift') state.isSprinting = false;
        });

        // Mouse look
        let isPointerLocked = false;
        canvas.addEventListener('click', () => {
            canvas.requestPointerLock();
        });
        document.addEventListener('pointerlockchange', () => {
            isPointerLocked = document.pointerLockElement === canvas;
        });
        document.addEventListener('mousemove', (e) => {
            if (!isPointerLocked) return;
            playerGroup.rotation.y -= e.movementX * 0.002;
            camera.rotation.x -= e.movementY * 0.002;
            camera.rotation.x = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, camera.rotation.x));
        });

        // ── Movement & Physics ────────────────────────────────────────────
        const clock = new THREE.Clock();

        function updateMovement() {
            const delta = clock.getDelta();
            const speed = state.moveSpeed * (state.isSprinting ? state.sprintMultiplier : 1);

            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(playerGroup.quaternion);
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(playerGroup.quaternion);

            const moveDir = new THREE.Vector3();
            if (state.keys['w']) moveDir.add(forward);
            if (state.keys['s']) moveDir.sub(forward);
            if (state.keys['d']) moveDir.add(right);
            if (state.keys['a']) moveDir.sub(right);

            if (moveDir.length() > 0) {
                moveDir.normalize().multiplyScalar(speed * delta);
                playerGroup.position.add(moveDir);
            }

            // Jump physics
            if (state.isJumping) {
                state.velocity.y -= 20 * delta;
                playerGroup.position.y += state.velocity.y * delta;
                if (playerGroup.position.y <= 0) {
                    playerGroup.position.y = 0;
                    state.isJumping = false;
                    state.velocity.y = 0;
                }
            }

            // Camera follow
            camera.position.x = playerGroup.position.x;
            camera.position.z = playerGroup.position.z + 15;
            camera.position.y = playerGroup.position.y + 10;
            camera.lookAt(playerGroup.position);

            // Update region
            updateRegion();
        }

        function updateRegion() {
            const pos = playerGroup.position;
            let region = 'Base';
            if (pos.z < -15) region = 'North';
            else if (pos.z > 15) region = 'South';
            else if (pos.x > 15) region = 'East';
            else if (pos.x < -15) region = 'West';

            if (region !== state.region) {
                state.region = region;
                document.getElementById('world-region').textContent = '📍 ' + region;
            }
        }

        // ── Interact ──────────────────────────────────────────────────────
        function interact() {
            const nearby = state.nearbyEntities.find(e => {
                const dx = e.x - playerGroup.position.x;
                const dz = e.z - playerGroup.position.z;
                return Math.sqrt(dx * dx + dz * dz) < 3;
            });
            if (nearby) {
                alert(`Interact with ${nearby.name}: ${nearby.icon}`);
            }
        }
        window.interact = interact;

        // ── Travel ────────────────────────────────────────────────────────
        function toggleTravel() {
            document.getElementById('travel-menu').classList.toggle('visible');
        }
        window.toggleTravel = toggleTravel;

        function travelTo(region) {
            const positions = {
                base: { x: 0, z: 0 },
                north: { x: 0, z: -25 },
                east: { x: 25, z: 0 },
                south: { x: 0, z: 25 },
                west: { x: -25, z: 0 },
                club: { x: 10, z: 10 },
            };
            const pos = positions[region];
            if (pos) {
                playerGroup.position.set(pos.x, 0, pos.z);
                document.getElementById('world-region').textContent = '📍 ' + region.charAt(0).toUpperCase() + region.slice(1);
            }
            document.getElementById('travel-menu').classList.remove('visible');
        }
        window.travelTo = travelTo;

        // ── Menu ──────────────────────────────────────────────────────────
        function openMenu() {
            // Open menu overlay or redirect to main menu
            if (window.opener) {
                window.opener.focus();
            }
        }
        window.openMenu = openMenu;

        // ── Minimap ───────────────────────────────────────────────────────
        const minimapCanvas = document.getElementById('minimap-canvas');
        const minimapCtx = minimapCanvas.getContext('2d');
        minimapCanvas.width = 160;
        minimapCanvas.height = 160;

        function updateMinimap() {
            minimapCtx.fillStyle = '#111827';
            minimapCtx.fillRect(0, 0, 160, 160);

            // Draw territories
            territories.forEach(t => {
                const x = 80 + (t.x / 100) * 70;
                const y = 80 + (t.z / 100) * 70;
                minimapCtx.fillStyle = '#' + t.color.toString(16).padStart(6, '0');
                minimapCtx.beginPath();
                minimapCtx.arc(x, y, 4, 0, Math.PI * 2);
                minimapCtx.fill();
            });

            // Draw player
            const px = 80 + (playerGroup.position.x / 100) * 70;
            const py = 80 + (playerGroup.position.z / 100) * 70;
            minimapCtx.fillStyle = '#6366f1';
            minimapCtx.beginPath();
            minimapCtx.arc(px, py, 5, 0, Math.PI * 2);
            minimapCtx.fill();

            // Draw entities
            state.nearbyEntities.forEach(e => {
                const ex = 80 + (e.x / 100) * 70;
                const ey = 80 + (e.z / 100) * 70;
                minimapCtx.fillStyle = '#' + e.color.toString(16).padStart(6, '0');
                minimapCtx.beginPath();
                minimapCtx.arc(ex, ey, 2, 0, Math.PI * 2);
                minimapCtx.fill();
            });
        }

        // ── Entity List ───────────────────────────────────────────────────
        function updateEntityList() {
            const list = document.getElementById('entity-list');
            list.innerHTML = state.nearbyEntities.slice(0, 6).map(e =>
                `<div class="entity-item"><span class="entity-icon">${e.icon}</span><span>${e.name}</span></div>`
            ).join('');
        }

        // ── Animation Loop ────────────────────────────────────────────────
        function animate() {
            requestAnimationFrame(animate);
            updateMovement();
            updateMinimap();
            updateEntityList();
            renderer.render(scene, camera);
        }

        // ── Init ──────────────────────────────────────────────────────────
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Hide loading
        setTimeout(() => {
            document.getElementById('world-loading').classList.add('hidden');
        }, 1000);

        // Load wallet
        try {
            const wallet = localStorage.getItem('wallet_address') || '';
            if (wallet) {
                state.wallet = wallet;
                document.getElementById('world-wallet').textContent = wallet.slice(0, 6) + '...' + wallet.slice(-4);
            }
        } catch(e) {}

        animate();
    </script>
</body>
</html>
